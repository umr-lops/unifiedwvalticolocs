# Poetry pyproject.toml: https://python-poetry.org/docs/pyproject/
[build-system]
requires = ["poetry_core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "unifiedwvalticolocs"
version = "2026.1.27"
description = "lib python to generate colocs S1 WV with CMEMS or CCI seatstate altimeters"
readme = "README.md"
authors = ["umr-lops <antoine.grouazel@ifremer.fr>"]
license = "MIT"
repository = "https://github.com/umr-lops/unifiedwvalticolocs"
homepage = "https://github.com/umr-lops/unifiedwvalticolocs"

# Keywords description https://python-poetry.org/docs/pyproject/#keywords
keywords = ["colocation","sentinel1","altimeters","CMEMS","Level-2","ocean","SWH","WV"]

# Pypi classifiers: https://pypi.org/classifiers/
classifiers = [  #! Update me
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]



[tool.poetry.dependencies]
python = "^3.11"
xarray = "2025.12.0"
pandas = '3.0.0'
tqdm = "4.67.1"
scipy = "1.17.0"
# s1ifr = "2026.1.13"


[tool.poetry.group.dev.dependencies]
bandit = "^1.8.2"
black = "^24.10.0"  # Version 26 doesn't exist yet; 24.x is current stable
darglint = "^1.8.1" # Warning: Project is unmaintained, 1.8.1 is the last version
isort = {extras = ["colors"], version = "^5.13.2"}
mypy = "^1.14.1"
mypy-extensions = "^1.0.0"
pre-commit = "^4.0.1"
pydocstyle = "^6.3.0"
pylint = "^3.3.3"
pytest = "^8.3.4"
pyupgrade = "^3.19.1"
safety = "^3.2.14"
coverage = "^7.6.10"
coverage-badge = "^1.1.2"
pytest-html = "^4.1.1"
pytest-cov = "^6.0.0"

[tool.black]
# https://github.com/psf/black
target-version = ["py39"]
line-length = 88
color = true

exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | env
    | venv
)/
'''

[tool.isort]
# https://github.com/timothycrosley/isort/
py_version = 39
line_length = 88

known_typing = ["typing", "types", "typing_extensions", "mypy", "mypy_extensions"]
sections = ["FUTURE", "TYPING", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
include_trailing_comma = true
profile = "black"
multi_line_output = 3
indent = 4
color_output = true

[tool.pylint.format]
max-line-length = 88

[tool.mypy]
# https://mypy.readthedocs.io/en/latest/config_file.html#using-a-pyproject-toml-file
python_version = "3.11"
pretty = true
show_traceback = true
color_output = true

allow_redefinition = false
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
ignore_missing_imports = true
implicit_reexport = false
no_implicit_optional = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
strict_equality = true
strict_optional = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true


[tool.pytest.ini_options]
# https://docs.pytest.org/en/6.2.x/customize.html#pyproject-toml
# Directories that are not visited by pytest collector:
norecursedirs =["hooks", "*.egg", ".eggs", "dist", "build", "docs", ".tox", ".git", "__pycache__"]
doctest_optionflags = ["NUMBER", "NORMALIZE_WHITESPACE", "IGNORE_EXCEPTION_DETAIL"]

# Extra options:
addopts = [
  "--strict-markers",
  "--tb=short",
  "--doctest-modules",
  "--doctest-continue-on-failure",
]

[tool.coverage.run]
source = ["tests"]
branch = true

[tool.coverage.paths]
source = "unifiedwvalticolocs"

[tool.coverage.report]
fail_under = 50
show_missing = true

[tool.poetry.scripts]
procunifiedwvalticolocs = "unifiedwvalticolocs.unified_coloc_WV_alti_cmems_or_cci:entrypoint"
