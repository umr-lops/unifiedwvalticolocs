[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "unifiedwvalticolocs"
dynamic = ["version"]
description = "lib python to generate colocs S1 WV with CMEMS or CCI seatstate altimeters"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "umr-lops", email = "antoine.grouazel@ifremer.fr" }]
keywords = [
  "colocation",
  "sentinel1",
  "altimeters",
  "CMEMS",
  "Level-2",
  "ocean",
  "SWH",
  "WV",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.11"

dependencies = [
  "xarray",
  "pandas",
  "tqdm",
  "scipy",
  "h5netcdf",
  "s1ifr",
  "h5py",
  "dask",
  "pyyaml",
]

[project.optional-dependencies]
dev = [
  "bandit",
  "black",
  "darglint",
  "flake8",
  "isort[colors]",
  "mypy",
  "mypy-extensions",
  "pre-commit",
  "pydocstyle",
  "pylint",
  "pytest",
  "pyupgrade",
  "safety",
  "coverage",
  "coverage-badge",
  "pytest-html",
  "pytest-cov",
]

[project.urls]
repository = "https://github.com/umr-lops/unifiedwvalticolocs"
homepage = "https://github.com/umr-lops/unifiedwvalticolocs"

[project.scripts]
procunifiedwvalticolocs = "unifiedwvalticolocs.unified_coloc_WV_alti_cmems_or_cci:entrypoint"
create-unified-wv-alti-job-array-listing = "unifiedwvalticolocs.create_listing_jobarray:entrypoint"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "unifiedwvalticolocs/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["unifiedwvalticolocs"]

[tool.hatch.build.targets.sdist]
include = ["unifiedwvalticolocs", "tests", "README.md"]

# Private index for s1ifr (local dev with uv)
[[tool.uv.index]]
name = "s1ifr"
url = "https://__token__${S1IFR_PYPI_TOKEN}@gitlab.ifremer.fr/api/v4/projects/4991/packages/pypi/simple"
explicit = true

[tool.uv.sources]
s1ifr = { index = "s1ifr" }

[tool.black]
target-version = ["py311"]
line-length = 88
color = true
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | env
    | venv
)/
'''

[tool.isort]
py_version = 311
line_length = 88
known_typing = ["typing", "types", "typing_extensions", "mypy", "mypy_extensions"]
sections = ["FUTURE", "TYPING", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
include_trailing_comma = true
profile = "black"
multi_line_output = 3
indent = 4
color_output = true

[tool.pylint.format]
max-line-length = 88

[tool.mypy]
python_version = "3.11"
pretty = true
show_traceback = true
color_output = true
allow_redefinition = false
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
ignore_missing_imports = true
implicit_reexport = false
no_implicit_optional = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
strict_equality = true
strict_optional = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
norecursedirs = ["hooks", "*.egg", ".eggs", "dist", "build", "docs", ".tox", ".git", "__pycache__"]
doctest_optionflags = ["NUMBER", "NORMALIZE_WHITESPACE", "IGNORE_EXCEPTION_DETAIL"]
addopts = [
  "--strict-markers",
  "--tb=short",
  "--doctest-modules",
  "--doctest-continue-on-failure",
]

[tool.coverage.run]
source = ["tests"]
branch = true

[tool.coverage.paths]
source = ["unifiedwvalticolocs"]

[tool.coverage.report]
fail_under = 50
show_missing = true
