# Poetry pyproject.toml: https://python-poetry.org/docs/pyproject/
[build-system]
requires = ["poetry_core>=1.0.0"]
build-backend = "poetry.core.masonry.api"


[project]
name = "unifiedwvalticolocs"
description = "lib python to generate colocs S1 WV with CMEMS or CCI seatstate altimeters"
readme = "README.md"
license = "MIT"
authors = [
  { name = "umr-lops", email = "antoine.grouazel@ifremer.fr" }
]
dependencies = [
    "xarray==2025.12.0",
    "pandas==3.0.0",
    "tqdm==4.67.1",
    "scipy==1.17.0",
    "h5netcdf==1.8.1",
    "s1ifr"
]
requires-python = ">=3.11,<4.0"
# Keywords description https://python-poetry.org/docs/pyproject/#keywords
keywords = ["colocation","sentinel1","altimeters","CMEMS","Level-2","ocean","SWH","WV"]
dynamic = ["version", "classifiers"]

[project.urls]
repository = "https://github.com/umr-lops/unifiedwvalticolocs"
homepage = "https://github.com/umr-lops/unifiedwvalticolocs"

[tool.poetry]
version = "2026.1.27"



[[tool.poetry.source]]
name = "ifremer"
url = "https://gitlab.ifremer.fr/api/v4/projects/4991/packages/pypi/simple"
priority = "supplemental"  # or "explicit"

[tool.poetry.dependencies]
s1ifr = {version = "2026.1.29", source = "ifremer"}



[tool.poetry.group.dev.dependencies]
bandit = "^1.9.3"
black = {version = "^26.1.0", allow-prereleases = true}  # Version 26 doesn't exist yet; 24.x is current stable
darglint = "^1.8.1" # Warning: Project is unmaintained, 1.8.1 is the last version
flake8 = "7.3.0"
isort = {extras = ["colors"], version = "^7.0.0"}
mypy = "^1.19.1"
mypy-extensions = "^1.0.0"
pre-commit = "^4.5.1"
pydocstyle = "^6.3.0"
pylint = "^4.0.4"
pytest = "^9.0.2"
pyupgrade = "^3.21.2"
safety = "^3.7.0"
coverage = "^7.13.2"
coverage-badge = "^1.1.2"
pytest-html = "^4.2.0"
pytest-cov = "^7.0.0"

[tool.black]
# https://github.com/psf/black
target-version = ["py39"]
line-length = 88
color = true

exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | env
    | venv
)/
'''

[tool.isort]
# https://github.com/timothycrosley/isort/
py_version = 39
line_length = 88

known_typing = ["typing", "types", "typing_extensions", "mypy", "mypy_extensions"]
sections = ["FUTURE", "TYPING", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
include_trailing_comma = true
profile = "black"
multi_line_output = 3
indent = 4
color_output = true

[tool.pylint.format]
max-line-length = 88

[tool.mypy]
# https://mypy.readthedocs.io/en/latest/config_file.html#using-a-pyproject-toml-file
python_version = "3.11"
pretty = true
show_traceback = true
color_output = true

allow_redefinition = false
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
ignore_missing_imports = true
implicit_reexport = false
no_implicit_optional = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
strict_equality = true
strict_optional = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true


[tool.pytest.ini_options]
# https://docs.pytest.org/en/6.2.x/customize.html#pyproject-toml
# Directories that are not visited by pytest collector:
norecursedirs =["hooks", "*.egg", ".eggs", "dist", "build", "docs", ".tox", ".git", "__pycache__"]
doctest_optionflags = ["NUMBER", "NORMALIZE_WHITESPACE", "IGNORE_EXCEPTION_DETAIL"]

# Extra options:
addopts = [
  "--strict-markers",
  "--tb=short",
  "--doctest-modules",
  "--doctest-continue-on-failure",
]

[tool.coverage.run]
source = ["tests"]
branch = true

[tool.coverage.paths]
source = ["unifiedwvalticolocs"]

[tool.coverage.report]
fail_under = 50
show_missing = true

[project.scripts]
procunifiedwvalticolocs = "unifiedwvalticolocs.unified_coloc_WV_alti_cmems_or_cci:entrypoint"
